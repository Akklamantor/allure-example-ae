name: mtu-check
on:
  push:
    branches: [mtu-check]
  workflow_dispatch:
jobs:
  mtu:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -s https://ipinfo.io/json; echo
          U=https://testing.qatools.cloud/api/management/health/
          for i in $(seq 1 20); do curl -s -o /dev/null --max-time 20 -w "direct connect=%{time_connect} tls=%{time_appconnect} code=%{http_code} exit=" $U; echo $?; done
          for i in $(seq 1 20); do curl -s -o /dev/null --max-time 20 --resolve testing.qatools.cloud:443:185.200.84.123 -w "via-kz connect=%{time_connect} tls=%{time_appconnect} code=%{http_code} exit=" $U; echo $?; done
